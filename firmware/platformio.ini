; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ESP32-C6 + Arduino needs the pioarduino platform (Arduino core 3.x).
; The stock PlatformIO "espressif32" registry package does not support C6 + Arduino.
[env]
; Uses the pioarduino espressif32 already installed locally (55.03.39).
; The "stable" release URL needs PlatformIO Core >= 6.2.0, newer than what's installed here.
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Supermini USB-C goes to the native USB-Serial-JTAG -> make `Serial` use it
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; Needed so Adafruit BusIO can find SPI.h / Wire.h
lib_ldf_mode = deep+

[env:esp32-c6-devkitm-1]
build_src_filter = +<*> -<i2c_scanner.cpp>
lib_deps = adafruit/Adafruit PWM Servo Driver Library@^3.0.3

; Build/flash with: pio run -e i2c_scanner -t upload -t monitor
[env:i2c_scanner]
build_src_filter = +<i2c_scanner.cpp>
