; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; `pio run` with no -e builds only the ESP32 servo/tactile firmware
default_envs = esp32-c6-devkitm-1

[esp32c6]
; Uses the pioarduino espressif32 already installed locally (55.03.39).
; The "stable" release URL needs PlatformIO Core >= 6.2.0, newer than what's installed here.
platform = espressif32
board = esp32-c6-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Supermini USB-C goes to the native USB-Serial-JTAG -> make `Serial` use it
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
; Needed so Adafruit BusIO can find SPI.h / Wire.h
lib_ldf_mode = deep+

; ESP32-C6: servos (PCA9685) + tactile data from the Nano over SPI
[env:esp32-c6-devkitm-1]
extends = esp32c6
build_src_filter = +<main.cpp>
lib_deps =
	adafruit/Adafruit PWM Servo Driver Library@^3.0.3
	adafruit/Adafruit INA219@^1.2.3

; Build/flash with: pio run -e i2c_scanner -t upload -t monitor
[env:i2c_scanner]
extends = esp32c6
build_src_filter = +<i2c_scanner.cpp>

; Arduino Nano tactile SPI slave. Build/flash with: pio run -e nano -t upload
; Our Nano has the new bootloader (115200 upload). For an old-bootloader Nano use board = nanoatmega328
[env:nano]
platform = atmelavr
board = nanoatmega328new
framework = arduino
build_src_filter = +<nano_tactile.cpp>

; DEBUG ONLY: unmodified FlexiTac 32_16_fast.ino, streams over the Nano's USB at 2 Mbaud.
; For A/B testing against nano_tactile.cpp. Reflash `nano` afterwards to restore the ESP32 link.
[env:nano_flexitac_stock]
extends = env:nano
build_src_filter = +<flexitac_stock.cpp>
